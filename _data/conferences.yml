# Conference deadline tracker configuration (/conferences/).
#
# Deadlines are pulled automatically from ccf-deadlines
# (https://github.com/ccfddl/ccf-deadlines) by scripts/update_conferences.rb,
# run weekly by .github/workflows/update-conferences.yml. The result is written
# to _data/conference_deadlines.yml — do NOT edit that file by hand.
#
# infos:  venues to track. Add a venue here to start tracking it.
#   tags            filter tags shown on the page
#   bk21/kiise/rank Korean BK21 IF, KIISE grade, CORE rank (rank-id: CORE portal id, optional)
#   ccfddl          path of the venue file under ccf-deadlines/conference/
#   ccfddl_comment  only keep deadlines whose comment matches this regex (e.g. ESOP inside ETAPS)
#
# manual: hand-written editions, used for venues without ccfddl data or to
#   override it (a manual entry replaces the ccfddl edition of the same venue).
#   Deadlines are "YYYY-MM-DD HH:mm" in `timezone` (default AoE). "TBA" if unknown.

